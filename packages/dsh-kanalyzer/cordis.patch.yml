# Profile Bundle layer for the standalone kanalyzer plugin.
#
# One Host row. Its id doubles as the settings namespace (DSH >= 0.2 addresses a plugin's settings by
# its entry id), so it is `kanalyzer`, the namespace the card and `settings.update()` use.
# The plugin publishes `ctx.kanalyzer`, its `kanalyzer_*` tools and the
# `/kanalyzer` command; a consumer (pbfuzz, or anything else) picks the service up through
# `ctx.inject(['kanalyzer'], …)` so everything it registers on top disappears with this row.
- insert:
    - id: kanalyzer
      name: '@pbfuzz/dsh-kanalyzer'
