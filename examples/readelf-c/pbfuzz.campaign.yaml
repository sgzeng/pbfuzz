version: 1
id: readelf-c
confirmed: true
target:
  repo: /mnt/work/pbfuzz/pbfuzz-dsh/examples/readelf-c
  language: cpp
bug:
  targets:
  - condition: header.e_ident[EI_CLASS] == ELFCLASS64 && header.e_ident[EI_DATA] == ELFDATA2MSB && header.e_ident[EI_VERSION] == EV_CURRENT && (entry == 0x400000 || entry == 0x8048000 || header.e_entry == 0x400000 || header.e_entry == 0x8048000)
    location: readelf.cpp:93
build:
  cmd: ./build.sh
entry:
  kind: executable
  run_cmd: ./readelf @@
  input_channel: file
  cwd: /mnt/work/pbfuzz/pbfuzz-dsh/examples/readelf-c
oracle:
  mode: preexisting
  reached_pattern: bug location reached
  triggered_pattern: bug location triggered
analysis:
  static:
    mode: lto
    bitcode: /mnt/work/pbfuzz/pbfuzz-dsh/examples/readelf-c/readelf.lto.0.0.preopt.bc
    entries:
    - main
  corpus:
    enabled: true
    seeds_dir: /mnt/work/pbfuzz/pbfuzz-dsh/examples/readelf-c/seeds
  deviation:
    enabled: true
    mode: critical_bb
output:
  dir: /mnt/work/pbfuzz/pbfuzz-dsh/examples/readelf-c/.pbfuzz/readelf-c
